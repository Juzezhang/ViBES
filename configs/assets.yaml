CONFIG_FOLDER: configs # Config files path
FOLDER: /path/to/experiments # Experiment files saving path

TEST:
  FOLDER: results # Testing files saving path

DATASET:
  MODEL_FILES_DIR: ./model_files
  SMPLX_MODEL_DIR: ${DATASET.MODEL_FILES_DIR}/smplx_models
  FLAME_MODEL_DIR: ${DATASET.MODEL_FILES_DIR}/FLAME2020
  SMPL_MODEL_DIR: ${DATASET.MODEL_FILES_DIR}/smpl_models
  SMPLH_FACES_PATH: ${DATASET.MODEL_FILES_DIR}/smplh/smplh.faces
  TRANSFORM_PATH: ${DATASET.MODEL_FILES_DIR}/transforms/
  WORD_VERTILIZER_PATH: ${DATASET.MODEL_FILES_DIR}/t2m_evaluators/glove/
  HUMANML3D:
    ROOT: "/path/to/HumanML3D" # HumanML3D directory
    SPLIT_ROOT: "/path/to/HumanML3D" # HumanML3D splits directory
    MEAN_STD_PATH: models/t2m/
  BEAT2:
    ROOT: /path/to/BEAT2/beat_english_v2.0.0 # BEAT2 directory 
  AMASS:
    ROOT: /path/to/AMASS # AMASS directory
  BONES:
    ROOT: /path/to/BONES_parts_25 # optional — BONES-SEED (proprietary license) preprocessed like AMASS parts_25
  AMASS_talking:
    ROOT: /path/to/AMASS_talking # AMASS_talking directory 
  AMASS_P2P:
    ROOT: /path/to/AMASS_p2p # AMASS_P2P directory 
  LIBRISPEECH:
    ROOT: "/path/to/LibriSpeech" # LibriSpeech directory  
  CANDOR:
    ROOT: "/path/to/CANDOR" # CANDOR directory  
  TFHP:
    ROOT: "/path/to/TFHP" # TFHP directory  
  YouTube_Talking:
    ROOT: "/path/to/YouTube_Talking" # YouTube_Talking directory  
  YouTube_Talking_Synthetic:
    ROOT: "/path/to/YouTube_Talking_Synthetic" # YouTube_Talking_Synthetic directory  
  AMASS_Genmo:
    ROOT: "/path/to/AMASS" # AMASS_Genmo directory  
  BEAT2_Genmo:
    ROOT: "/path/to/BEAT2/beat_english_v2.0.0" # BEAT2_Genmo directory  




METRIC:
  TM2T:
    t2m_path: ../language_of_motion/model_files/t2m_evaluators/t2m/ # path for tm2t evaluator
  CO_SPEECH:
    e_path: weights/AESKConv_240_100.bin
    params:
      vae_test_len: 32
      vae_test_dim: 330
      vae_test_stride: 20
      vae_length: 240
      vae_codebook_size: 256
      vae_layer: 4
      vae_grow: [1,1,2,1]
      variational: False
      vae_quantizer_lambda: 1.0
      e_name: VAESKConv
      data_path_1: ${DATASET.MODEL_FILES_DIR}/

# model:
#   whisper_path: ../language_of_motion/model_files/whisper-large-v2 # path for whisper model, webui only

RENDER:
  BLENDER_PATH: /root/blender-2.93.18-linux-x64/blender
  SMPL_MODEL_DIR: ${DATASET.SMPL_MODEL_DIR}
  SMPLX_MODEL_DIR: ${DATASET.SMPLX_MODEL_DIR}
  SMPLH_FACES_PATH: ${DATASET.SMPLH_FACES_PATH}
